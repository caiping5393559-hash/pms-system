name: PMS scheduled iCal sync

on:
  schedule:
    # Separate off-peak schedules are more reliable than */10 on GitHub's
    # shared scheduler, which had been coalescing this repository to one run
    # per hour and can drop jobs near the start of an hour.
    - cron: '7 * * * *'
    - cron: '17 * * * *'
    - cron: '27 * * * *'
    - cron: '37 * * * *'
    - cron: '47 * * * *'
    - cron: '57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  trigger-ical-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake PMS and trigger iCal sync
        env:
          PMS_BASE_URL: https://pms-system-708g.onrender.com
          PMS_OIDC_AUDIENCE: https://pms-system-708g.onrender.com/api/cron/ical-sync
          PMS_SYNC_URL: https://pms-system-708g.onrender.com/api/cron/ical-sync
        run: |
          set -euo pipefail

          # Render can briefly return 5xx responses while an instance wakes up.
          # Warm the service first, but do not fail the job if the health request
          # itself is transient; the authenticated sync call below is authoritative.
          curl --silent --show-error --output /dev/null \
            --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
            --connect-timeout 20 --max-time 60 \
            "${PMS_BASE_URL}/api/version" || true

          OIDC_TOKEN="$(
            curl --fail --silent --show-error --get \
              --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
              --connect-timeout 15 --max-time 45 \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --data-urlencode "audience=${PMS_OIDC_AUDIENCE}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
            | jq -er '.value'
          )"

          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 \
            --connect-timeout 30 --max-time 180 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            "${PMS_SYNC_URL}"
