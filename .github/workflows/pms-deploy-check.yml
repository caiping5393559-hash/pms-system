name: PMS deploy readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

# Render is connected directly to main with native auto-deploy. This workflow
# validates every revision; Render starts deployment from the same push.
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check all tracked Python files
        run: |
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Check frontend syntax
        run: node --check static/pms_app.js
